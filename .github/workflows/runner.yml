{"name":"runner","on":{"schedule":[{"cron":"23 * * * *"}],"workflow_dispatch":null},"permissions":{"contents":"read","models":"read","actions":"write"},"concurrency":{"group":"runner","cancel-in-progress":false},"jobs":{"runner":{"runs-on":"ubuntu-latest","timeout-minutes":25,"steps":[{"uses":"actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683","with":{"repository":"skyredregon/menews","token":"${{ secrets.MENEWS_PAT }}","ref":"main"}},{"uses":"actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065","with":{"python-version":"3.13"}},{"name":"Collect and write news","env":{"GEMINI_API_KEY":"${{ secrets.GEMINI_API_KEY }}","GROQ_API_KEY":"${{ secrets.GROQ_API_KEY }}","OPENROUTER_API_KEY":"${{ secrets.OPENROUTER_API_KEY }}","CEREBRAS_API_KEY":"${{ secrets.CEREBRAS_API_KEY }}","MISTRAL_API_KEY":"${{ secrets.MISTRAL_API_KEY }}","FREELLMAPI_URL":"${{ secrets.FREELLMAPI_URL }}","FREELLMAPI_KEY":"${{ secrets.FREELLMAPI_KEY }}","NVIDIA_API_KEY":"${{ secrets.NVIDIA_API_KEY }}","SAMBANOVA_API_KEY":"${{ secrets.SAMBANOVA_API_KEY }}","HF_TOKEN":"${{ secrets.HF_TOKEN }}","COHERE_API_KEY":"${{ secrets.COHERE_API_KEY }}","CLOUDFLARE_ACCOUNT_ID":"${{ secrets.CLOUDFLARE_ACCOUNT_ID }}","ZAI_API_KEY":"${{ secrets.ZAI_API_KEY }}","SILICONFLOW_API_KEY":"${{ secrets.SILICONFLOW_API_KEY }}","DEEPSEEK_API_KEY":"${{ secrets.DEEPSEEK_API_KEY }}","LLM_EXTRA":"${{ secrets.LLM_EXTRA }}","CLOUDFLARE_AI_TOKEN":"${{ secrets.CLOUDFLARE_AI_TOKEN }}","GITHUB_TOKEN":"${{ github.token }}"},"run":"python pipeline/run.py"},{"name":"Build site","run":"python build/build.py"},{"name":"Save new stories and state","run":"mkdir -p content/posts state\n\ngit config user.name \"menews-bot\"\ngit config user.email \"menews-bot@users.noreply.github.com\"\n\ngit add -A -- content state\n\nif ! git diff --cached --quiet; then\n  git commit -m \"Autopost $(date -u +%Y-%m-%dT%H:%MZ)\"\n  git pull --rebase -X theirs || { git checkout --theirs state || true; git add -A state; GIT_EDITOR=true git rebase --continue; }\n  for i in 1 2 3 4; do\n    git push && break\n    git pull --rebase -X theirs || { git checkout --theirs state || true; git add -A state; GIT_EDITOR=true git rebase --continue || true; }\n    sleep 4\n  done\nfi\n"},{"name":"Deploy to Netlify","env":{"NETLIFY_AUTH_TOKEN":"${{ secrets.NETLIFY_AUTH_TOKEN || secrets.ETLIFY_AUTH_TOKEN }}","NETLIFY_SITE_ID":"${{ secrets.NETLIFY_SITE_ID }}"},"run":"if [ -z \"$NETLIFY_AUTH_TOKEN\" ] || [ -z \"$NETLIFY_SITE_ID\" ]; then echo \"Netlify secrets are not set, skipping deploy\"; exit 0; fi\nnpx --yes netlify-cli@27.16.1 deploy --prod --no-build --dir=dist --message \"MeNews $(date -u +%Y-%m-%dT%H:%MZ)\"\n"},{"name":"Notify search engines","env":{"BING_WEBMASTER_KEY":"${{ secrets.BING_WEBMASTER_KEY }}"},"run":"python pipeline/notify.py"},{"name":"Keep schedule alive","if":"always()","env":{"GH_TOKEN":"${{ github.token }}"},"run":"gh workflow enable runner.yml --repo ${{ github.repository }} || true"}]}}}
